name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'push'
    runs-on: laravel-remote-logger
    timeout-minutes: 30
    concurrency:
      group: laravel-remote-logger-tests
      cancel-in-progress: false

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure native PHP toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/laravel-remote-logger-php"
          echo "memory_limit=-1" \
            > "$RUNNER_TEMP/laravel-remote-logger-php/99-ci-memory.ini"
          echo "PHP_INI_SCAN_DIR=/opt/homebrew/etc/php/8.5/conf.d:$RUNNER_TEMP/laravel-remote-logger-php" \
            >> "$GITHUB_ENV"
          {
            echo "/opt/homebrew/opt/php/bin"
            echo "/opt/homebrew/opt/php/sbin"
            echo "/opt/homebrew/bin"
            echo "$HOME/.local/bin"
          } >> "$GITHUB_PATH"

      - name: Verify native toolchain
        run: |
          set -euo pipefail
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 5 ? 0 : 1);'
          php -r 'exit(extension_loaded("xdebug") ? 0 : 1);'
          XDEBUG_MODE=coverage php -r '
            exit(in_array("coverage", xdebug_info("mode"), true) ? 0 : 1);
          '
          composer --version --no-ansi | grep -E '^Composer version 2\.'

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests with enforced coverage
        env:
          XDEBUG_MODE: coverage
        run: composer test:coverage

      - name: Remove temporary PHP configuration
        if: always()
        run: rm -rf "$RUNNER_TEMP/laravel-remote-logger-php"

  pull-request-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests with enforced coverage
        run: composer test:coverage
